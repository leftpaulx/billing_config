[project]
name = "billing-config-poc"
version = "0.1.0"
description = "OpenBorder billing configuration POC: PostgreSQL schema, config API and rule editor UI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "pydantic>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    # Embedded PostgreSQL binaries for local dev/tests when no server is available.
    "pgserver>=0.1.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

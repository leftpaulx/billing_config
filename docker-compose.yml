# Optional: a real PostgreSQL instead of the embedded dev server.
#   docker compose up -d
#   DATABASE_URL=postgresql://billing:billing@localhost:5432/billing uv run scripts/dev.py
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
      POSTGRES_DB: billing
    ports:
      - "5432:5432"
    volumes:
      - billing-pg:/var/lib/postgresql/data

volumes:
  billing-pg:
